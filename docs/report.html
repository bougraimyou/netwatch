<style>
:root {
  --bg: #0b0f14;
  --panel: #121821;
  --panel-2: #0f151d;
  --line: #1e2733;
  --text: #d7dee8;
  --muted: #8592a3;
  --accent: #4cc2a4;
  --critical: #ff5f56;
  --high: #ff8f4d;
  --medium: #ffc857;
  --low: #5aa9e6;
  --info: #8b97a8;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(1200px 600px at 20% -10%, #14202b 0%, var(--bg) 55%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 72px; }

.top {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
  padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.brand { font-family: var(--mono); font-size: 22px; letter-spacing: 0.02em; }
.brand .dot { color: var(--accent); }
.top .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
.spacer { flex: 1; }
.pill {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
}

h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); margin: 36px 0 14px; font-weight: 600;
}
h2:first-of-type { margin-top: 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
}
.card .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.card .v { font-family: var(--mono); font-size: 24px; margin-top: 6px; }
.card .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card.alert-card .v { color: var(--medium); }
.card.alert-card.clean .v { color: var(--accent); }

.alerts { display: grid; gap: 12px; }
.alert {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--info);
  border-radius: 10px; padding: 16px 18px;
}
.alert.critical { border-left-color: var(--critical); }
.alert.high { border-left-color: var(--high); }
.alert.medium { border-left-color: var(--medium); }
.alert.low { border-left-color: var(--low); }
.alert .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip {
  font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.chip.critical { color: var(--critical); }
.chip.high { color: var(--high); }
.chip.medium { color: var(--medium); }
.chip.low { color: var(--low); }
.chip.info { color: var(--info); }
.alert .title { font-weight: 600; font-size: 15px; }
.alert .sum { color: var(--muted); font-size: 13px; margin-top: 6px; font-family: var(--mono); }
.alert .host { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.alert .desc { margin-top: 10px; font-size: 14px; color: var(--text); opacity: 0.92; }

details { margin-top: 12px; }
summary {
  cursor: pointer; color: var(--accent); font-size: 13px; font-family: var(--mono);
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; display: inline-block; transition: transform 0.15s; }
details[open] summary::before { transform: rotate(90deg); }

.evidence { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.kv { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; gap: 4px 16px; font-size: 13px; }
.kv .k { color: var(--muted); font-family: var(--mono); }
.kv .v { font-family: var(--mono); word-break: break-word; }

.hex {
  margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: #9fb0c3;
  overflow-x: auto; white-space: pre-wrap; word-break: break-all;
}
.hex .label { color: var(--muted); display: block; margin-bottom: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 10px; border-bottom: 1px solid var(--line);
}
td { padding: 8px 10px; border-bottom: 1px solid rgba(30, 39, 51, 0.6); font-family: var(--mono); }
tr:last-child td { border-bottom: none; }
td.num { text-align: right; color: var(--muted); }

.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 90px; gap: 12px; align-items: center; font-family: var(--mono); font-size: 12px; }
.bar-track { background: var(--panel-2); border-radius: 6px; height: 10px; overflow: hidden; border: 1px solid var(--line); }
.bar-fill { height: 100%; background: linear-gradient(90deg, #2f7f6b, var(--accent)); }
.bar-row .n { text-align: right; color: var(--muted); }

.note {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; font-size: 13px; color: var(--muted);
}
.note ul { margin: 8px 0 0; padding-left: 20px; }
.note li { margin: 4px 0; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; font-family: var(--mono); }
.status-ok { color: var(--accent); }
.status-skip { color: var(--medium); }
.empty { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 14px 0; }

@media (max-width: 640px) {
  .kv { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 70px 1fr 70px; }
}

</style>

        display = value.length ? value.join(", ") : "(none)";
      } else if (value && typeof value === "object") {
        display = JSON.stringify(value);
      } else {
        display = String(value);
      }
      if (display.length > 600) display = display.slice(0, 600) + "...";
      rows.push(el("div", { class: "k", text: key }));
      rows.push(el("div", { class: "v", text: display }));
    });

    var block = el("div", { class: "evidence" }, [
      el("div", { class: "kv" }, rows)
    ]);

    (alert.packets || []).forEach(function (packet) {
      var caption = "packet #" + packet.packet;
      if (packet.hex) {
        block.appendChild(
          el("div", { class: "hex" }, [
            el("span", { class: "label", text: caption + " - first " + packet.bytes + " bytes" }),
            document.createTextNode(packet.hex.match(/.{1,32}/g).join("\n"))
          ])
        );
      } else if (packet.note) {
        block.appendChild(el("div", { class: "hex" }, [
          el("span", { class: "label", text: caption }),
          document.createTextNode(packet.note)
        ]));
      }
    });
    return block;
  }

  function renderAlert(alert) {
    var evidenceCount = Object.keys(alert.evidence || {}).length;
    var detail = el("details", null, [
      el("summary", { text: "evidence" }),
      renderEvidence(alert)
    ]);
    return el("article", { class: "alert " + alert.severity }, [
      el("div", { class: "head" }, [
        el("span", { class: "chip " + alert.severity, text: alert.severity }),
        el("span", { class: "title", text: alert.title }),
        el("span", { class: "spacer" }),
        el("span", { class: "host", text: alert.host || "" })
      ]),
      el("div", { class: "sum", text: alert.summary || "" }),
      el("div", { class: "desc", text: alert.description || "" }),
      detail
    ]);
  }

  function renderBars(items, valueKey, labelKey) {
    if (!items.length) return el("div", { class: "empty", text: "No data in this capture." });
    var max = Math.max.apply(
      null,
      items.map(function (item) {
        return item[valueKey];
      })
    );
    return el(
      "div",
      { class: "bars" },
      items.map(function (item) {
        var width = max > 0 ? Math.max(2, (item[valueKey] / max) * 100) : 0;
        return el("div", { class: "bar-row" }, [
          el("span", { text: item[labelKey] }),
          el("div", { class: "bar-track" }, [el("div", { class: "bar-fill", style: "width:" + width + "%" })]),
          el("span", { class: "n", text: human(item[valueKey]) })
        ]);
      })
    );
  }

  function renderTable(headers, rows, numericColumns) {
    if (!rows.length) return el("div", { class: "empty", text: "No data in this capture." });
    var head = el(
      "tr",
      null,
      headers.map(function (header) {
        return el("th", { text: header });
      })
    );
    var body = rows.map(function (row) {
      return el(
        "tr",
        null,
        row.map(function (cell, index) {
          var isNum = (numericColumns || []).indexOf(index) !== -1;
          return el("td", { class: isNum ? "num" : null, text: cell });
        })
      );
    });
    return el("table", null, [el("thead", null, [head]), el("tbody", null, body)]);
  }

  function renderRuleStatus(rules) {
    var rows = rules.map(function (rule) {
      return [
        rule.name,
        rule.ran ? "ran" : "skipped",
        rule.ran ? String(rule.alerts) : rule.skipped_reason || ""
      ];
    });
    var table = renderTable(["rule", "status", "alerts"], rows, [2]);
    table.querySelectorAll("tbody tr").forEach(function (row, index) {
      var cell = row.children[1];
      cell.className = rules[index].ran ? "status-ok" : "status-skip";
    });
    return table;
  }

  function render(report) {
    var root = document.getElementById("app");
    root.textContent = "";

    var capture = report.capture || {};
    var counts = report.severity_counts || {};
    var alertTotal = report.alert_count || 0;

    var top = el("header", { class: "top" }, [
      el("div", { class: "brand" }, [
        document.createTextNode("netwatch"),
        el("span", { class: "dot", text: "." })
      ]),
      el("span", { class: "meta", text: capture.name || "" }),
      el("span", { class: "spacer" }),
      el("span", { class: "pill", text: "v" + ((report.tool || {}).version || "?") }),
      el("span", { class: "pill", text: (report.tool || {}).generated_at || "" })
    ]);
    root.appendChild(top);

    root.appendChild(el("h2", { text: "Capture" }));
    root.appendChild(
      el("div", { class: "cards" }, [
        card("packets", human(capture.packets), null),
        card("traffic", capture.wire_bytes_human || "0 B", (capture.payload_bytes_human || "") + " payload"),
        card("flows", human(capture.flows), null),
        card("hosts", human(capture.hosts), null),
        card("duration", duration(capture.duration_s), capture.start || ""),
        card(
          "alerts",
          String(alertTotal),
          alertTotal ? Object.keys(counts).map(function (k) { return k + " " + counts[k]; }).join("  ") : "nothing fired",
          alertTotal ? "alert-card" : "alert-card clean"
        )
      ])
    );

    root.appendChild(el("h2", { text: "Alerts" }));
    var alerts = report.alerts || [];
    if (!alerts.length) {
      root.appendChild(
        el("div", { class: "note" }, [
          el("div", { text: "No rule fired on this capture." }),
          el("ul", null, [
            el("li", { text: "That is a result, not an absence of checks. The rule status table below shows which rules actually ran." })
          ])
        ])
      );
    } else {
      root.appendChild(el("div", { class: "alerts" }, alerts.map(renderAlert)));
    }

    root.appendChild(el("h2", { text: "Rules" }));
    root.appendChild(renderRuleStatus(report.rules || []));

    root.appendChild(el("h2", { text: "Protocols" }));
    root.appendChild(renderBars(report.protocols || [], "packets", "name"));

    root.appendChild(el("h2", { text: "Top talkers" }));
    root.appendChild(
      renderTable(
        ["host", "scope", "out", "in", "peers", "ports", "dns"],
        (report.top_hosts || []).map(function (host) {
          return [host.address, host.scope, human(host.bytes_out), human(host.bytes_in), String(host.peers), String(host.ports), String(host.dns_queries)];
        }),
        [4, 5, 6]
      )
    );

    root.appendChild(el("h2", { text: "Largest flows" }));
    root.appendChild(
      renderTable(
        ["source", "destination", "proto", "packets", "payload"],
        (report.top_flows || []).map(function (flow) {
          return [
            flow.src + ":" + flow.sport,
            flow.dst + ":" + flow.dport,
            flow.proto,
            String(flow.packets),
            flow.bytes_human
          ];
        }),
        [3, 4]
      )
    );

    root.appendChild(el("h2", { text: "DNS" }));
    root.appendChild(
      renderTable(
        ["domain", "queries"],
        (report.top_domains || []).map(function (item) {
          return [item.domain, String(item.queries)];
        }),
        [1]
      )
    );

    var integrity = report.integrity || {};
    var limitations = report.limitations || [];
    root.appendChild(el("h2", { text: "What this report does not claim" }));
    root.appendChild(
      el("div", { class: "note" }, [
        el("div", { text: "Scope and known limits of this run." }),
        el("ul", null, limitations.map(function (text) { return el("li", { text: text }); })),
        el("ul", null, [
          el("li", { text: "baseline: " + ((report.baseline || {}).description || "not supplied") }),
          el("li", { text: "retained packet samples: " + (integrity.raw_samples_retained || 0) }),
          el("li", {
            text: "vlans: " + ((integrity.vlans || []).length ? integrity.vlans.join(", ") : "none tagged")
          })
        ])
      ])
    );

    root.appendChild(
      el("footer", null, [
        el("div", {
          text: "NetWatch reads a capture and answers one question: what in this traffic does not look like the rest of it."
        })
      ])
    );
  }

  function fail(message) {
    var root = document.getElementById("app");
    root.textContent = "";
    var hint =
      window.location.protocol === "file:"
        ? "Browsers block fetch() on file:// URLs. Open report.html for the self-contained version, or serve this folder over HTTP (python -m http.server -d docs)."
        : "Run `netwatch serve` or serve the folder over HTTP; the dashboard needs report.json next to index.html.";
    root.appendChild(
      el("div", { class: "note" }, [
        el("div", { text: "Could not load a report." }),
        el("ul", null, [el("li", { text: message }), el("li", { text: hint })])
      ])
    );
  }

  function boot() {
    if (window.__NETWATCH_REPORT__) {
      render(window.__NETWATCH_REPORT__);
      return;
    }
    fetch("report.json", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("report.json returned " + response.status);
        return response.json();
      })
      .then(render)
      .catch(function (error) {
        fail(String(error.message || error));
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
