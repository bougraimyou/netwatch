name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # One definition of the demo: the Makefile target the README cites.
      - name: Build the demo site
        run: make site
      - name: The demo must contain a report and a dashboard
        run: |
          test -s docs/report.json
          test -s docs/index.html
          python - <<'PY'
          import json
          report = json.load(open("docs/report.json"))
          assert report["alert_count"] > 0, "the published demo has no alerts"
          rules = {alert["rule"] for alert in report["alerts"]}
          assert {"port_scan", "dns_anomaly", "beaconing", "cleartext_credentials"} <= rules, rules
          print("demo report:", report["alert_count"], "alerts across", sorted(rules))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
