name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no dependencies to install)
        run: python -m pip install -e .
      - name: Test suite
        run: python -m unittest discover -s tests -v
      - name: End-to-end demo
        run: |
          python -m netwatch demo --out demo
          python -m netwatch analyze tests/fixtures/clean.pcap --fail-on-alerts
          python -m netwatch analyze tests/fixtures/mixed.pcap --baseline tests/fixtures/baseline.json
        shell: bash

  no-dependencies:
    name: assert zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: A fresh venv must be able to run the tool
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps .
          .venv/bin/netwatch --version
          .venv/bin/netwatch demo --out demo
          .venv/bin/netwatch analyze demo/captures/mixed.pcap --json /tmp/report.json
      - name: No third-party imports in the package
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          standard = set(sys.stdlib_module_names)
          offenders = []
          for path in pathlib.Path("netwatch").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [alias.name.split(".")[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  for name in names:
                      if name not in standard and name != "netwatch":
                          offenders.append(f"{path}: {name}")
          if offenders:
              print("\n".join(offenders))
              raise SystemExit("third-party import found in the package")
          print("package imports only the standard library")
          PY

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Wheel contains the dashboard assets
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for asset in ("app.js", "style.css", "index.html"):
              assert any(name.endswith("static/" + asset) for name in names), asset
          print(wheel, len(names), "files")
          PY
